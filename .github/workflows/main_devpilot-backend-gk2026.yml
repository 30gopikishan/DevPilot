name: Build and deploy Node.js app to Azure Web App - devpilot-backend-gk2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Build
        working-directory: server
        run: npm run build --if-present

      - name: Test
        working-directory: server
        run: npm run test --if-present

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_403BC6BCCCE334E21A6D2D56CABE1293E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4BB02FFE9354D7993111EFE8E0891DC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E3E02A54A1548D1BEE5C489F2B4401B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devpilot-backend-gk2026'
          slot-name: 'Production'
          package: .
